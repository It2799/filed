name: Scrape announcements

# Every 45 minutes from 06:00 to 23:15 IST, then a final full pass at 23:30.
#
# Cron cannot say "every 45 minutes" - 45 does not divide into 60 - so the
# slots are written out by minute below. A warm run takes about 45 seconds,
# because summaries and market caps are cached by filing id and only genuinely
# new filings cost anything.
#
# Two shapes of run:
#   * the half-hourly ones only scrape TODAY, which takes about a minute
#   * the last run of the night rescrapes the whole 7-day window, so the
#     dashboard stays complete even if a run was missed
#
# Summaries are cached by filing id, so a repeat pass only pays for filings it
# has not seen before - usually a handful.

# NOTE ON RELIABILITY
# GitHub's schedule event is best effort. Their documentation says runs are
# delayed under load and may be dropped entirely, and on 1 September 2026 it
# dropped 16 of the 23 slots below - the site sat unchanged from 13:28 to
# 17:22 IST. Every run GitHub did create finished normally; the problem is
# that most were never created at all.
#
# So the schedule below is a fallback, not the primary clock. The real trigger
# is an external cron calling web/app/api/cron/scrape, which dispatches this
# workflow through the API. workflow_dispatch starts within seconds and is
# never dropped. See that file for the setup.

on:
  schedule:
    # Every 45 minutes, 06:00 to 23:15 IST, seven days a week. IST is UTC+5:30,
    # and cron cannot say "every 45 minutes" because 45 does not divide into 60,
    # so the slots are spelled out by minute. Single spaces only - a malformed
    # entry can void the whole block.
    # Odd minutes on purpose. GitHub's own documentation says scheduled runs
    # are delayed at times of high load, and that load peaks on the hour and
    # on the quarters - which is exactly where these used to sit. On 1
    # September 16 of 23 slots were never created at all, leaving a 3h54m hole
    # over the middle of the day. Moving off the boundary is not a cure, only
    # a nudge; the cure is the dispatch trigger described at the top.
    - cron: "37 0,3,6,9,12,15 * * *"
    - cron: "22 1,4,7,10,13,16 * * *"
    - cron: "7 2,5,8,11,14,17 * * *"
    - cron: "52 2,5,8,11,14,17 * * *"
    # 23:30 IST - the last pass of the day, which rescrapes the full 7 days.
    - cron: "7 18 * * *"

  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to scrape"
        required: false
        default: "7"
      max_summaries:
        description: "Cap on AI calls (0 = summarise every relevant filing)"
        required: false
        default: "0"

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Forty minutes, not 330. The old ceiling was five and a half hours, and
    # because runs queue rather than cancel, one hung download held the whole
    # schedule for that long - on 1 September a run sat there 5h29m while
    # seven scheduled runs behind it were cancelled and the site went stale.
    # A pass that has not finished in forty minutes is not going to produce
    # anything the next one won't, and each day is published as it completes,
    # so a run cut short still leaves everything it had already written.
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip                    # shaves ~20s off every run

      - run: pip install --quiet -r requirements.txt

      - name: Restore summary and market-cap caches
        uses: actions/cache@v4
        with:
          path: |
            cache.json
            mcap.json
            triage.json
          key: caches-${{ github.run_id }}
          restore-keys: caches-

      - name: Decide how much to scrape
        id: plan
        run: |
          # --days N counts BACK from today, so it covers N+1 days: --days 0
          # is today alone, --days 1 was today and yesterday. The top-up has
          # been quietly doing twice the work its comment claimed, every 45
          # minutes, all day. The nightly stays at 7, which is 8 days built
          # and the oldest clipped by the 7-day window.
          if [ -n "${{ github.event.inputs.days }}" ]; then
            DAYS="${{ github.event.inputs.days }}"          # manual run wins
          elif [ "$(date -u +%H)" -ge 18 ]; then
            DAYS=7                                          # nightly full pass
          else
            DAYS=0                                          # quick top-up: today only
          fi
          echo "days=$DAYS" >> "$GITHUB_OUTPUT"
          echo "Scraping $DAYS day(s)"

      - name: Scrape, summarise and publish
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: >-
          python -u publish.py
          --days "${{ steps.plan.outputs.days }}"
          --max-summaries "${{ github.event.inputs.max_summaries || 0 }}"
          --workers 8
          --read-workers 32

      # Every bug that reached the dashboard so far would have been caught here.
      # If this fails the run goes red, so a broken dashboard is visible in the
      # Actions tab instead of being found by someone using the site.
      - name: Verify the live site
        run: python tools/verify_live.py

      - name: Keep the caches for the next run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caches
          path: |
            cache.json
            mcap.json
            triage.json
          retention-days: 3
          if-no-files-found: ignore
