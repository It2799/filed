name: Scrape announcements

# Every 30 minutes, around the clock, every day of the week.
#
# Two shapes of run:
#   * the half-hourly ones scrape TODAY only and summarise whatever is new - a
#     warm one takes a couple of minutes, nearly all of it reading PDFs the
#     cache has not seen yet
#   * one run a night, 23:37 IST, rescrapes the whole 7-day window so the
#     dashboard stays complete even if runs were missed
#
# It runs overnight too. The exchanges file little at 3am, so those passes are
# cheap - but filings do appear at odd hours, and a reader opening the site
# before the market does should not be looking at last evening's page.
#
# Summaries, market caps and PDF reads are all cached by filing id, so a repeat
# pass only pays for genuinely new filings.

# NOTE ON RELIABILITY
# GitHub's schedule event is best effort. Their documentation says runs are
# delayed under load and may be dropped entirely, and on 1 September 2026 it
# dropped 16 of the 23 slots below - the site sat unchanged from 13:28 to
# 17:22 IST. Every run GitHub did create finished normally; the problem is
# that most were never created at all.
#
# So the schedule below is a fallback, not the primary clock. The real trigger
# is an external cron calling web/app/api/cron/scrape, which dispatches this
# workflow through the API. workflow_dispatch starts within seconds and is
# never dropped. See that file for the setup.

on:
  schedule:
    # :07 and :37 of every hour, all 24 of them. Not :00 and :30 - GitHub's
    # documentation says scheduled runs are delayed when load peaks, and load
    # peaks on the hour and the half hour.
    #
    # 18:07 UTC is spelled out on its own line so the job can recognise it:
    # that is the one run a day that rescrapes the full week, and it has to be
    # identifiable from github.event.schedule.
    - cron: "37 * * * *"
    - cron: "7 0-17,19-23 * * *"
    - cron: "7 18 * * *"

  workflow_dispatch:
    inputs:
      days:
        description: "Days back to scrape. Blank = today during the day, 7 at night."
        required: false
        default: ""
      max_summaries:
        description: "Cap on AI calls (0 = summarise every relevant filing)"
        required: false
        default: "0"

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # A top-up must finish inside its own 15 minute slot, or it holds up the
    # next one - runs queue rather than cancel. Thirteen minutes leaves a
    # margin, and a cut-short run is no longer wasted now that the cache saves
    # either way, so the next run picks up where this one stopped.
    #
    # The nightly full pass gets 40: it has seven days to get through, and
    # nothing is waiting behind it at that hour.
    # A full 7-day pass needs the longer ceiling however it was started: on
    # the nightly cron, by hand, or by the dispatch endpoint asking for days=7.
    timeout-minutes: >-
      ${{ (github.event.schedule == '7 18 * * *'
           || github.event.inputs.days == '7') && 40 || 13 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip                    # shaves ~20s off every run

      - run: pip install --quiet -r requirements.txt

      # restore + save as separate steps, so the save can run `if: always()`.
      # actions/cache saves only when the job succeeded, so a run that was cut
      # short - by the timeout, or by a failed verify - threw away every PDF it
      # had read. At a 15 minute cadence that matters: a run that does not
      # quite finish must still hand its work to the next one, or the same
      # documents get read over and over and no run ever gets ahead.
      - name: Restore summary and market-cap caches
        id: caches
        uses: actions/cache/restore@v4
        with:
          path: |
            cache.json
            mcap.json
            triage.json
          key: caches-${{ github.run_id }}
          restore-keys: caches-

      # Before anything is scraped, let alone published. These are guards on
      # the scoring rules, every one of them a mistake that reached the live
      # site once: a word that reads unambiguously in a headline turning out
      # to be ordinary English inside a PDF. If a rule change would mislabel
      # filings, the run stops here rather than putting it on the dashboard.
      - name: Check the scoring rules
        run: python tests/test_rules.py

      - name: Decide how much to scrape
        id: plan
        run: |
          # --days N counts BACK from today, so it covers N+1 days: --days 0
          # is today alone, --days 1 was today and yesterday. The top-up has
          # been quietly doing twice the work its comment claimed, every 45
          # minutes, all day. The nightly stays at 7, which is 8 days built
          # and the oldest clipped by the 7-day window.
          # This used to default to "7", which meant EVERY dispatch - including
          # one from the 15-minute cron endpoint - ran a full seven-day pass
          # instead of a today-only top-up. Blank now, so an unqualified
          # dispatch behaves exactly like a scheduled run.
          # The full pass is ONE named slot, not "any run after 18:00 UTC". With
          # a run every half hour that test would have made twelve full passes
          # a night, each one a twenty minute job, instead of a single one.
          if [ -n "${{ github.event.inputs.days }}" ]; then
            DAYS="${{ github.event.inputs.days }}"          # asked for explicitly
          elif [ "${{ github.event.schedule }}" = "7 18 * * *" ]; then
            DAYS=7                                          # the nightly full pass
          else
            DAYS=0                                          # top-up: today only
          fi
          echo "days=$DAYS" >> "$GITHUB_OUTPUT"
          echo "Scraping $DAYS day(s)"

      - name: Scrape, summarise and publish
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: >-
          python -u publish.py
          --days "${{ steps.plan.outputs.days }}"
          --max-summaries "${{ github.event.inputs.max_summaries || 0 }}"
          --workers 8
          --read-workers 32

      # Every bug that reached the dashboard so far would have been caught here.
      # If this fails the run goes red, so a broken dashboard is visible in the
      # Actions tab instead of being found by someone using the site.
      - name: Verify the live site
        run: python tools/verify_live.py

      - name: Keep the caches for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            cache.json
            mcap.json
            triage.json
          key: caches-${{ github.run_id }}
