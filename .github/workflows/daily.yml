name: Daily announcement scrape

# Wakes up every evening, reads the last 7 days of filings from NSE and BSE,
# summarises every relevant one, and pushes the result to Redis. The website
# reads from Redis, so the page is as fresh as the last run.
#
# It rescrapes the whole 7-day window each time rather than just the newest day.
# Summaries are cached by filing id, so re-reading a day that is already done
# costs nothing - and it means the 7 days on the site are always complete, even
# if a run is missed.
#
# Run it by hand from the Actions tab, or: gh workflow run daily.yml

on:
  schedule:
    # 16:00 UTC = 21:30 IST. Indian markets close at 15:30 IST and filings land
    # through the evening. Runs every day - companies file at weekends too.
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to scrape"
        required: false
        default: "7"
      max_summaries:
        description: "Cap on AI calls (0 = summarise every relevant filing)"
        required: false
        default: "0"

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet requests pypdf

      # Summaries are cached by filing id, so restoring the cache means a rerun
      # never pays for the same PDF twice.
      - name: Restore summary cache
        uses: actions/cache@v4
        with:
          path: cache.json
          key: summaries-${{ github.run_id }}
          restore-keys: summaries-

      - name: Scrape, summarise and publish
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: >-
          python -u publish.py
          --days "${{ github.event.inputs.days || 7 }}"
          --max-summaries "${{ github.event.inputs.max_summaries || 0 }}"
          --workers 8

      - name: Keep a copy of the run for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache
          path: cache.json
          retention-days: 7
          if-no-files-found: ignore
